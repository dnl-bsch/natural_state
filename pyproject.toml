[project]
name = "natural-state"
version = "0.1.0"
description = "Natural State take-home project: vegetation QA/QC and BirdNET observations"
readme = "README.md"
authors = [
    { name = "Daniel Busch", email = "daniel.busch@climate-resource.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "statsmodels>=0.15.0",
]

[project.scripts]
birds = "natural_state.birds.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "mypy>=2.4.0",
    "pandas-stubs",
    "pytest",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# Notebooks are exploratory: cells end with bare expressions to display tables.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test names describe the behaviour, so tests do not need docstrings.
"tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
